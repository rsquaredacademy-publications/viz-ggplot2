project:
  type: book
  output-dir: _book
  resources:
    - site-kit

# Interactive R cells (scatter pilot only) via WebAssembly.
# Scoped to HTML: the webr lua filter rewrites the AST and breaks
# the Typst template's #callout definition for PDF output.
quarto-required: ">=1.6.0"

sitemap: true

website:
  site-url: https://viz-ggplot2.rsquaredacademy.com/
  description: "Learn ggplot2 in R: recipes for scatter, line, bar, box, facets, themes - run in browser."
  open-graph: true
  twitter-card: true

book:
  title: "Data Visualization with ggplot2"
  author: "Aravind Hebbali"
  downloads: [pdf, epub]
  chapters:
    - index.qmd
    - about-the-author.qmd
    - ggplot2-quicktour.qmd
    - ggplot2-geoms.qmd
    - ggplot2-aesthetics.qmd
    - ggplot2-labels.qmd
    - ggplot2-text-annotations.qmd
    - ggplot2-scatter-plot.qmd
    - ggplot2-line-graph.qmd
    - ggplot2-bar-plot.qmd
    - ggplot2-box-plot.qmd
    - ggplot2-histogram.qmd
    - ggplot2-modify-axis.qmd
    - ggplot2-modify-legend.qmd
    - ggplot2-legend-color-fill.qmd
    - ggplot2-legend-shape-size-alpha.qmd
    - ggplot2-facets.qmd
    - ggplot2-themes.qmd
    - ggplot2-position-stats.qmd
    - ggplot2-scales-accessibility.qmd
    - ggplot2-reshaping.qmd
    - ggplot2-label-polish.qmd
    - ggplot2-finale-polish.qmd
    - ggplot2-export-communicate.qmd
  page-footer:
    center: |
      We use Google Analytics 4 to understand how people use this site (pages visited, referring sites, device type and approximate location) so we can improve our free learning material. Google Analytics uses cookies and a pseudonymous identifier; we don't use it for advertising and we never send Google names or email addresses. Visitors in the European Economic Area, the United Kingdom and Switzerland are asked for consent first, and if they decline, no analytics cookies are stored. Anyone can switch analytics off at any time: <a href="#" data-rsa-analytics-optout>Turn off analytics</a>.

execute:
  freeze: auto
  warning: false

format:
  html:
    filters:
      - webr
    theme:
      light: flatly
      dark: darkly
    toc-depth: 3
    search: true
    code-copy: true
    code-overflow: wrap
    fig-align: center
    fig-dpi: 192
    include-in-header:
      - includes/site-kit-head.html
    repo-url: https://github.com/rsquaredacademy-publications/viz-ggplot2/
  pdf:
    pdf-engine: lualatex
    papersize: us-letter
    toc-depth: 3
    code-overflow: wrap
    # PNG figures: sidesteps external pdfcrop tooling entirely.
    # 300 dpi stays print-crisp.
    fig-format: png
    fig-dpi: 300
  epub:
    toc-depth: 2
    code-overflow: wrap
